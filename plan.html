<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A MeFit workout plan</title>
<meta name="description" content="Someone shared a workout plan with you. Open it in MeFit to add it to your routines.">
<meta name="robots" content="noindex">
<style>
  :root{--bg:#F2F2F7;--card:#fff;--text:#111114;--muted:#5b5b62;--line:#e5e5ea;--accent:#C6FF3D}
  @media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#f2f2f7;--muted:#a1a1a8;--line:#38383a}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:520px;margin:0 auto;padding:28px 16px 40px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
  .brand i{width:34px;height:34px;border-radius:10px;background:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-style:normal;color:#111114}
  h1{font-size:30px;line-height:1.15;margin:22px 0 4px;letter-spacing:-.02em}
  .sub{color:var(--muted);margin:0 0 18px}
  .btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;border-radius:16px;border:0;font:700 17px system-ui,sans-serif;text-decoration:none;cursor:pointer}
  .primary{background:var(--accent);color:#111114}
  .ghost{background:var(--card);color:var(--text);margin-top:10px}
  .day{background:var(--card);border-radius:18px;padding:14px 16px;margin-top:12px}
  .day b{display:block;margin-bottom:6px}
  .ex{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:7px 0;font-size:15px}
  .ex span:last-child{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
  .note{color:var(--muted);font-size:14px;margin-top:16px}
  .err{background:var(--card);border-radius:18px;padding:16px;margin-top:16px}
</style>
</head>
<body>
<main>
  <div class="brand"><i>M</i>MeFit</div>
  <div id="app"><h1>Loading plan…</h1></div>
  <p class="note">MeFit is a free, offline gym log. Plans carry exercises, sets and reps only, never anyone's weights or history.</p>
</main>
<script>
(function(){
  'use strict';
  var PKG = 'com.priyeshmayank.tallyset';
  var PLAY = 'https://play.google.com/store/apps/details?id=' + PKG;
  var app = document.getElementById('app');
  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function fail(msg){
    app.textContent = '';
    app.appendChild(el('h1', null, 'This plan link is incomplete'));
    app.appendChild(el('p', 'sub', msg));
    var a = el('a', 'btn ghost', 'Get MeFit'); a.href = PLAY; app.appendChild(a);
  }
  var code = (location.hash || '').slice(1);
  if (!/^[A-Za-z0-9_-]{8,24000}$/.test(code)) return fail('Ask your friend to share the plan again from MeFit and send the whole link.');
  var p;
  try {
    var s = code.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
    var bin = atob(s), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    p = JSON.parse(new TextDecoder().decode(bytes));
  } catch (e) { return fail('The link was cut off. Ask your friend to send it again.'); }
  if (!p || p.v !== 1 || !Array.isArray(p.days)) return fail('This isn’t a MeFit plan.');

  var days = p.days.slice(0, 14), nEx = 0;
  days.forEach(function(d){ nEx += (d && Array.isArray(d.x) ? Math.min(d.x.length, 30) : 0); });
  var android = /Android/i.test(navigator.userAgent);
  var intentUrl = 'intent://plan#Intent;scheme=mefit;package=' + PKG + ';S.code=' + code + ';S.browser_fallback_url=' + encodeURIComponent(PLAY) + ';end';

  app.textContent = '';
  document.title = String(p.name || 'Workout plan').slice(0, 60) + ' · MeFit plan';
  app.appendChild(el('h1', null, String(p.name || 'Workout plan').slice(0, 60)));
  app.appendChild(el('p', 'sub', days.length + ' day' + (days.length === 1 ? '' : 's') + ' · ' + nEx + ' exercise' + (nEx === 1 ? '' : 's') + ' · shared from MeFit'));
  if (android){
    var open = el('a', 'btn primary', 'Open in MeFit'); open.href = intentUrl; app.appendChild(open);
    var get = el('a', 'btn ghost', 'Don’t have MeFit? Get it free'); get.href = PLAY; app.appendChild(get);
  } else {
    app.appendChild(el('p', 'sub', 'Open this link on your Android phone to add the plan to MeFit.'));
  }
  var WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  days.forEach(function(d){
    if (!d || !Array.isArray(d.x)) return;
    var c = el('div', 'day'); c.appendChild(el('b', null, String(d.n || 'Day').slice(0, 40) + (p.sch === 'weekly' && d.wd >= 0 && d.wd <= 6 ? ' · ' + WD[d.wd] : '')));
    d.x.slice(0, 30).forEach(function(x){
      if (!Array.isArray(x)) return;
      var r = el('div', 'ex'); r.appendChild(el('span', null, String(x[0] || '').slice(0, 60)));
      var lo = +x[6] || 0, hi = +x[7] || lo;
      r.appendChild(el('span', null, (+x[5] || 0) + ' × ' + lo + (hi > lo ? '–' + hi : '') + (x[3] === 't' ? ' s' : '')));
      c.appendChild(r);
    });
    app.appendChild(c);
  });
  // Try to hand straight over to the app (Chrome allows this right after a tap in WhatsApp).
  // No fallback here: if MeFit isn't installed, the page simply stays so the person can read the plan.
  if (android) setTimeout(function(){ location.href = 'intent://plan#Intent;scheme=mefit;package=' + PKG + ';S.code=' + code + ';end'; }, 350);
})();
</script>
</body>
</html>
